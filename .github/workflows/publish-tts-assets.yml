name: Publish TTS voice + runtime assets

# Mirrors the Piper voice models Detour's on-device neural voice feature needs onto this repo's
# own GitHub Releases, rather than having the app or Detour's build fetch them from Hugging
# Face's CDN directly. This repo exists (separate from the private detour repo) specifically so
# these release-asset URLs are fetchable without authentication — see README.md. Every fetched
# file is checked against a SHA-256 pinned in this workflow, not trusted blindly: the checksums
# below were computed by hand from a real download and cross-checked against the Content-Length
# each upstream host reported for the same URL before this workflow was ever written; a mismatch
# fails the job outright rather than publishing something silently different from what was
# verified.
#
# The two `previews/*.wav` files are different in kind from everything else here: they are NOT
# mirrored from a third party, they're short clips generated locally (via a scratch onnxruntime
# harness running the real DutchG2P + these exact voice weights) and committed straight into this
# repo, so there's no upstream URL/checksum to verify them against — the repo itself is the
# source. They exist so Detour's voice-picker UI can let a driver hear a few seconds of a voice
# before committing to a ~60 MB download of the real thing.
#
# Manual trigger only, not on every push: these files are essentially immutable once a voice is
# chosen (see docs/PROJECT-STATE.md in the detour repo for that decision) — nothing here benefits
# from running automatically. Re-running this workflow re-publishes the same fixed tag — safe to
# do again if a URL or checksum ever needs updating.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Piper voices, from rhasspy/piper-voices on Hugging Face. ⚠️ Licenses are per-voice, not a
  # blanket "Piper voices are MIT" claim — checked against each voice's own real MODEL_CARD file
  # on Hugging Face, not assumed from Piper's project-level README. en_US-ryan-high's MODEL_CARD
  # names its training dataset's license as CC BY-NC-SA 4.0 (NonCommercial) — flagged for the
  # app owner to review given this app is commercially distributed, not silently corrected here
  # either direction; see docs/PROJECT-STATE.md in the detour repo. English: highest quality
  # tier Piper publishes for en_US ("high" — Dutch has no high tier).
  EN_VOICE_ONNX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx
  EN_VOICE_ONNX_SHA256: b3990d7606e183ec8dbfba70a4607074f162de1a0c412e0180d1ff60bb154eca
  EN_VOICE_JSON_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx.json
  EN_VOICE_JSON_SHA256: c6d3b98f08315cb4bebf0d49d50fc4ff491b503c64b940cd3d5ca28543b48011
  # Dutch: two single-speaker nl_NL voices, chosen over the multi-speaker nl_NL-mls-medium this
  # repo mirrored previously — real by-ear comparison (the owner's own listening test) found the
  # multi-speaker MLS voice sounded "artificial and robotic" across every one of its 52 speakers,
  # while both of these single-speaker voices sounded clearly better. Both CC0 (confirmed against
  # each voice's own real MODEL_CARD, not assumed) — a cleaner license than the multi-speaker
  # voice they replace (CC-BY 4.0) and than the English voice above. "pim" is the same voice
  # DutchG2P (github.com/proairface/KotlinG2P) was itself tuned and by-ear-verified against
  # during its own development — see that repo's docs/DUTCH-G2P-HANDOVER.md.
  PIM_VOICE_ONNX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_NL/pim/medium/nl_NL-pim-medium.onnx
  PIM_VOICE_ONNX_SHA256: 403e58c3675c394f505c2428117bf34cc56e9542dcf6eadbdd3a84706c12e048
  PIM_VOICE_JSON_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_NL/pim/medium/nl_NL-pim-medium.onnx.json
  PIM_VOICE_JSON_SHA256: 08b58456ca00cf77123826b1712758f99d5fd19ddfb7ec7da8e1a715b047f642
  ALEX_VOICE_ONNX_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_NL/alex/medium/nl_NL-alex-medium.onnx
  ALEX_VOICE_ONNX_SHA256: 22f0497c4d895a09fbc6a469459aa8954ea0955d3c6e19dbcc2e23acbb93e30b
  ALEX_VOICE_JSON_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_NL/alex/medium/nl_NL-alex-medium.onnx.json
  ALEX_VOICE_JSON_SHA256: 9ea643871742c038511b6aaf20e6fc098a78a11968122d2f6ca3e50403423f95

jobs:
  fetch-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify every mirrored asset against its pinned SHA-256
        run: |
          mkdir -p dist
          fetch() {
            local url="$1" out="$2" expected="$3"
            echo "Fetching $url"
            curl -sSL --fail -o "dist/$out" "$url"
            actual=$(sha256sum "dist/$out" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$out checksum mismatch — expected $expected, got $actual"
              exit 1
            fi
            echo "  OK: $out ($actual)"
          }
          fetch "$EN_VOICE_ONNX_URL" "en_US-ryan-high.onnx" "$EN_VOICE_ONNX_SHA256"
          fetch "$EN_VOICE_JSON_URL" "en_US-ryan-high.onnx.json" "$EN_VOICE_JSON_SHA256"
          fetch "$PIM_VOICE_ONNX_URL" "nl_NL-pim-medium.onnx" "$PIM_VOICE_ONNX_SHA256"
          fetch "$PIM_VOICE_JSON_URL" "nl_NL-pim-medium.onnx.json" "$PIM_VOICE_JSON_SHA256"
          fetch "$ALEX_VOICE_ONNX_URL" "nl_NL-alex-medium.onnx" "$ALEX_VOICE_ONNX_SHA256"
          fetch "$ALEX_VOICE_JSON_URL" "nl_NL-alex-medium.onnx.json" "$ALEX_VOICE_JSON_SHA256"
          # Not fetched/verified against a URL — generated and committed directly, see the
          # workflow header comment.
          cp previews/nl_NL-pim-medium-preview.wav dist/
          cp previews/nl_NL-alex-medium-preview.wav dist/
          ls -la dist/

      - name: Write a checksums manifest for the release page
        run: |
          cd dist
          sha256sum * > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Publish the tts-assets-v1 release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: tts-assets-v1
          name: "TTS voice + runtime assets v1"
          body: |
            Voice model files Detour's on-device neural voice feature depends on, plus two short
            preview clips for its voice-picker UI. See README.md for the full account of what's
            here and why.

            - `en_US-ryan-high.onnx` / `.onnx.json` — English voice, from
              [rhasspy/piper-voices](https://huggingface.co/rhasspy/piper-voices) (`en/en_US/ryan/high`).
              ⚠️ Its MODEL_CARD names the training dataset's license as CC BY-NC-SA 4.0
              (NonCommercial) — under owner review, see docs/PROJECT-STATE.md in the detour repo.
            - `nl_NL-pim-medium.onnx` / `.onnx.json` and `nl_NL-alex-medium.onnx` / `.onnx.json` —
              two single-speaker Dutch voices, CC0, from the same source (`nl/nl_NL/pim/medium`,
              `nl/nl_NL/alex/medium`). Both offered in the app; the driver picks.
            - `nl_NL-pim-medium-preview.wav` / `nl_NL-alex-medium-preview.wav` — short (2-4s)
              locally-generated preview clips, not mirrored from anywhere — see README.md.
            - `CHECKSUMS.txt` — SHA-256 of every file above, for anyone verifying by hand. Detour
              itself pins these same values in code rather than trusting this file at runtime.

            Fixed tag, not versioned per run — re-publish this workflow if a URL or checksum
            ever needs to change. See `docs/PROJECT-STATE.md` in the detour repo for why these
            specific voices were chosen.
          prerelease: true
          files: |
            dist/en_US-ryan-high.onnx
            dist/en_US-ryan-high.onnx.json
            dist/nl_NL-pim-medium.onnx
            dist/nl_NL-pim-medium.onnx.json
            dist/nl_NL-alex-medium.onnx
            dist/nl_NL-alex-medium.onnx.json
            dist/nl_NL-pim-medium-preview.wav
            dist/nl_NL-alex-medium-preview.wav
            dist/CHECKSUMS.txt
